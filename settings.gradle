pluginManagement {
    repositories {
        // 国内镜像加速（Gradle 插件）
        maven { name = 'Aliyun-Gradle-Plugin'; url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}
